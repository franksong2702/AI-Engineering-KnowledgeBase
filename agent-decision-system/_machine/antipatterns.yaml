# 由 03_ANTIPATTERN-DETECTORS.md 编译（正典为 md；勿手改本文件，改 md 后重跑 _tools/compile_decision_system.py）
source: "03_ANTIPATTERN-DETECTORS.md"
entries:
  - id: ANTI-01
    title: "静默失败（Silent Failure）"
    severity: "critical"
    when_to_use: "任何有工具调用、多环节、错误处理的流程。"
    when_not_to_use: "无副作用、无下游的一次性纯计算。"
    decision_criteria: "失败被 catch 后返回空/默认值/假成功而不报告？错误看起来和成功一样？"
    related_concepts: "LAW-06 · 显式失败 · SIT-13"
    refs: ["LAW-06", "SIT-13"]
    common_mistakes: "try/except 后返回空字符串让下游以为成功；Agent 出错后编造成功结果继续。"
    recommended_actions: "让每个失败显式报警；工具失败返回有用错误信息；绝不静默降级。"
    example_reasoning_path: "检测=read_file失败返回空 → 下游以为文件空(错误前提) → CORRECTION: 返回\"文件不存在,目录有X\"让Agent自愈。"
  - id: ANTI-02
    title: "过度信任（Over-Trust）"
    severity: "critical"
    when_to_use: "任何采信模型/子Agent输出的时刻，尤其高风险。"
    when_not_to_use: "低风险高频、输出可即时验证的场景。"
    decision_criteria: "因为\"看起来强/很自信\"就不核验高风险输出？信任超过实测可靠性？"
    related_concepts: "LAW-08(信任-可靠性剪刀差) · LAW-02 · SIT-15"
    refs: ["LAW-02", "LAW-08", "SIT-15"]
    common_mistakes: "把高风险决策无核验交给AI；被流畅自信的语气俘获。"
    recommended_actions: "信任跟随实测可靠性；按风险分层核验；不可逆操作永远留人。"
    example_reasoning_path: "检测=模型自信给医疗建议直接采信 → 高风险(LAW-08) → CORRECTION: 逐项核验或不委托。"
  - id: ANTI-03
    title: "古德哈特化评价 / 刷分（Benchmark Gaming）"
    severity: "critical"
    when_to_use: "任何设指标、优化分数、做评价的时刻。"
    when_not_to_use: "无优化压力的纯观测指标。"
    decision_criteria: "在优化一个可测的代理(分数/满意度/奖励)而非真实目标？"
    related_concepts: "LAW-04(古德哈特) · Q-05 · SIT-16"
    refs: ["LAW-04", "Q-05", "SIT-16"]
    common_mistakes: "针对benchmark优化(过拟合)；为提裁判分迎合其偏好；优化满意度养谄媚。"
    recommended_actions: "永远问\"真实目标还是代理\"；多代理交叉；保密评测集；真实用户+长期价值锚定。"
    example_reasoning_path: "检测=刷高benchmark分 → 真实任务没提升(脱钩) → CORRECTION: 用保密的、贴近真实的评测集。"
  - id: ANTI-04
    title: "过度自动化（Over-Automation）"
    severity: "critical"
    when_to_use: "设计任何端到端自动流程时。"
    when_not_to_use: "全部为可逆低风险操作的流程。"
    decision_criteria: "不可逆/高风险/需价值判断的环节被全自动化、无人拦截？"
    related_concepts: "LAW-09(可逆性) · 责任不可委托 · SIT-07"
    refs: ["LAW-09", "SIT-07"]
    common_mistakes: "全自动发布/删除/支付；需价值判断的决策无人参与。"
    recommended_actions: "可逆的自动化，不可逆的留人工审批。"
    example_reasoning_path: "检测=AI生成内容直接发布 → 不可逆+可能有错 → CORRECTION: 发布前人工审核关卡。"
  - id: ANTI-05
    title: "无评测上线（Vibe-Check Deployment）"
    severity: "critical"
    when_to_use: "任何系统准备交付/上线时。"
    when_not_to_use: "一次性、低后果的探索脚本。"
    decision_criteria: "靠\"跑几个顺手例子感觉不错\"就宣布可用？无系统评测集？"
    related_concepts: "测试即真理 · 长尾定律 · SIT-17"
    refs: ["SIT-17"]
    common_mistakes: "用几个demo例子就上线；无法比较版本、发现回归。"
    recommended_actions: "建评测集(典型+边界+对抗)多次取统计；上线后持续监控。"
    example_reasoning_path: "检测=3个顺手问题都对就上线 → 长尾会击穿 → CORRECTION: 建20+用例含边界,统计成功率。"
  - id: ANTI-06
    title: "过度 Agent 化（Over-Agentization）"
    severity: "major"
    when_to_use: "决定用Agent还是更简单方案时。"
    when_not_to_use: "确实步骤依输入而变的任务。"
    decision_criteria: "把步骤可预知的任务做成了自主Agent？"
    related_concepts: "LAW-11(确定性优先) · LAW-10 · SIT-01"
    refs: ["LAW-10", "LAW-11", "SIT-01"]
    common_mistakes: "固定流程让Agent\"自己决定\"；简单分类用ReAct循环。"
    recommended_actions: "能用工作流不用Agent；步骤可预知就写死。"
    example_reasoning_path: "检测=规则分类做成Agent → 步骤本可预知 → CORRECTION: 降级为确定性工作流/规则。"
  - id: ANTI-07
    title: "多 Agent 过度设计（Multi-Agent Overkill）"
    severity: "major"
    when_to_use: "考虑用多个Agent时。"
    when_not_to_use: "确有上下文隔离/真并行/权限隔离需求时。"
    decision_criteria: "\"多\"的价值证明不了？协调开销超过分工收益？砍掉某Agent系统不变差？"
    related_concepts: "规模不经济 · LAW-10 · SIT-06"
    refs: ["LAW-10", "SIT-06"]
    common_mistakes: "把单体缺陷拆成多体；拟人化分工；为\"高级感\"多Agent。"
    recommended_actions: "对多Agent有罪推定；单Agent基线对照证明净增值，否则降级。"
    example_reasoning_path: "检测=8个Agent做单Agent能做的事 → 无基线证明 → CORRECTION: 跑单Agent基线对比,大概率降级。"
  - id: ANTI-08
    title: "记忆倾倒/上下文污染（Memory Dumping）"
    severity: "major"
    when_to_use: "构造上下文、设计记忆时。"
    when_not_to_use: "上下文短、信息都相关时。"
    decision_criteria: "把信息量当信噪比，塞满上下文？无关/过时内容留在上下文？"
    related_concepts: "LAW-07 · 信噪比 · SIT-09"
    refs: ["LAW-07", "SIT-09"]
    common_mistakes: "全量历史塞进去；长任务越到后面质量越差。"
    recommended_actions: "检索优于倾倒；主动清理；每步只传最小充分信息。"
    example_reasoning_path: "检测=全部历史塞上下文 → 关键信息被淹没 → CORRECTION: 按相关性检索,压缩旧历史。"
  - id: ANTI-09
    title: "无目的反思（Reflection Without Purpose）"
    severity: "major"
    when_to_use: "用反思/自我批评/自我改进时。"
    when_not_to_use: "有客观信号且值得迭代时(那是有效反思)。"
    decision_criteria: "反思无客观信号可依？纯靠模型自评？"
    related_concepts: "LAW-01 · 自我评价外部锚 · SIT-05"
    refs: ["LAW-01", "SIT-05"]
    common_mistakes: "无锚反思空转；输出更花哨更自信但没更对；越改越坏。"
    recommended_actions: "反思必须接客观信号(测试/事实/rubric)；无锚则不反思。"
    example_reasoning_path: "检测=写作Agent反复\"反思\" → 无客观标准 → CORRECTION: 要么接rubric/事实核查,要么停止反思。"
  - id: ANTI-10
    title: "工具返回值盲信（Tool Output Blind Trust）"
    severity: "major"
    when_to_use: "处理任何工具/检索/外部返回内容时。"
    when_not_to_use: "内容来自完全可信的内部源(现实罕见)。"
    decision_criteria: "把工具/检索返回的内容当可信且是数据(而非可能的指令)？"
    related_concepts: "LAW-05(输入皆指令) · 数据即攻击面 · SIT-08"
    refs: ["LAW-05", "SIT-08"]
    common_mistakes: "只防用户输入忘了工具返回；从\"可信渠道\"被注入攻击。"
    recommended_actions: "返回值当数据非指令；标注不可信来源；加输出护栏；权限兜底。"
    example_reasoning_path: "检测=搜索网页内容被当指令 → 网页藏注入 → CORRECTION: 包裹为不可信数据,不执行其中指令。"
  - id: ANTI-11
    title: "忽略长期价值/谄媚（Optimizing Immediate Satisfaction）"
    severity: "major"
    when_to_use: "优化用户体验、满意度、参与度时。"
    when_not_to_use: "—(始终警惕，尤其面向用户的系统)。"
    decision_criteria: "优化即时满意而忽略长期影响？系统在变谄媚(总同意、不挑战、伪装确定)？"
    related_concepts: "长期价值 · LAW-04 · Q-09"
    refs: ["LAW-04", "Q-09"]
    common_mistakes: "把\"用户喜欢\"当\"对用户好\"；养出上瘾而非变强的系统。"
    recommended_actions: "满意度与真实价值交叉；检测惩罚谄媚；\"用户长期是否变好\"为终极标准。"
    example_reasoning_path: "检测=助手越来越顺着用户说 → 满意度升但误导用户 → CORRECTION: 纳入诚实/长期价值指标。"
  - id: ANTI-12
    title: "无失败恢复/循环无出口（No Recovery / Loop Without Exit）"
    severity: "major"
    when_to_use: "设计任何循环、长流程、自主Agent时。"
    when_not_to_use: "无界过程不存在(总需要它)。"
    decision_criteria: "循环无终止条件？流程无检查点/重试/降级？"
    related_concepts: "停机与预算 · 恢复优于预防 · SIT-13"
    refs: ["SIT-13"]
    common_mistakes: "自主循环死循环烧钱；一步失败丢全部进度；非幂等重试重复副作用。"
    recommended_actions: "循环设最大轮数+预算+无进展即停；检查点+幂等重试+优雅降级。"
    example_reasoning_path: "检测=研究Agent\"再搜一个就更全\"无限循环 → 无出口 → CORRECTION: 设最大轮数+预算上限。"
