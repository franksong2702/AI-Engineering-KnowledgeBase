    avoid: "ANTI-10(抽取结果盲信) · ANTI-02(视觉流畅感导致过度信任) · ANTI-04(过度自动化：截图/语音直接触发不可逆动作) · ANTI-05(无评测上线：只测任务答案不测“它看没看对”)"
