# 由 01_SITUATION-ROUTER.md 编译（正典为 md；勿手改本文件，改 md 后重跑 _tools/compile_decision_system.py）
source: "01_SITUATION-ROUTER.md"
entries:
  - id: SIT-01
    title: "我要决定用工作流还是自主 Agent"
    situation: "有一个任务要自动化，不确定该写固定流程还是让 Agent 自主决策。"
    diagnosis: "这是\"确定性 vs 自主性\"的架构选择。根本判据是任务的**步骤是否可预知**。"
    relevant_laws: "LAW-11(确定性优先) · LAW-10(简单优先) · LAW-06(误差累积：自主链越长越不可靠)"
    refs: ["ANTI-06", "LAW-06", "LAW-10", "LAW-11", "PAT-02", "PAT-08", "PAT-09", "PAT-16"]
    recommended_patterns: "步骤可预知→PAT-08(Pipeline/Prompt Chaining)或 PAT-16(Routing)；步骤依输入而变→PAT-02(ReAct)；需先规划→PAT-09(Planner-Executor)。"
    avoid: "ANTI-06(过度 Agent 化——把可预知流程做成自主 Agent)"
    evaluation_checklist: "☐ 我能在动手前画出流程图吗？能→用工作流。☐ 自主性带来的方差/成本被收益证明了吗？"
  - id: SIT-02
    title: "任务需要外部信息或实时数据"
    situation: "要回答/处理的内容依赖模型可能不知道的知识（私有、实时、专有）。"
    diagnosis: "知识缺口。模型不能凭空产生它没有的信息，纯推理会编造。"
    relevant_laws: "LAW-02(压缩有损→幻觉) · LAW-13(信息守恒：垃圾进垃圾出) · 检索优于记忆"
    refs: ["ANTI-10", "LAW-02", "LAW-13", "PAT-03", "PAT-04", "Q-01"]
    recommended_patterns: "PAT-03(RAG——注入知识) · PAT-04(Tool Use——取实时/精确数据)"
    avoid: "推理不接地(对需要外部信息的问题纯靠推理) · ANTI-10(检索盲信——返回内容当可信)"
    evaluation_checklist: "☐ 每个事实断言可溯源到外部出处吗？☐ 检索命中率够吗？☐ 检索不到时系统拒答而非编造吗？(Q-01)"
  - id: SIT-03
    title: "任务需要多步推理"
    situation: "直接问模型容易错，任务涉及逻辑/数学/因果/规划的多步推导。"
    diagnosis: "需要给模型\"演算空间\"，且需控制多步误差累积。"
    relevant_laws: "LAW-06(误差累积) · 分解降难"
    refs: ["ANTI-09", "LAW-06", "PAT-01", "PAT-10", "Q-08"]
    recommended_patterns: "PAT-01(CoT——先推理后结论) · 难题→PAT-10(Self-Consistency 投票) · 大跨度→分解为可验证小步"
    avoid: "ANTI-09(无目的反思) · 简单任务上滥用 CoT(纯开销)"
    evaluation_checklist: "☐ 推理链的结论被独立验证了吗？☐ 长推理拆成可验证小步了吗？☐ 我看的是轨迹不只结果吗？(Q-08)"
  - id: SIT-04
    title: "输出要被程序/下游消费"
    situation: "生成的结果要被代码解析、存库、传给下一环或触发动作。"
    diagnosis: "需要机器可读的稳定结构，不能是自由散文。"
    relevant_laws: "为验证而设计 · LAW-07(契约显式化)"
    refs: ["LAW-07", "PAT-07"]
    recommended_patterns: "PAT-07(Structured Output——schema 约束) · 复杂任务可先自由推理再抽成结构"
    avoid: "靠正则从散文抠数据(脆弱) · 过度约束损害内容质量"
    evaluation_checklist: "☐ 每个输出都是合法可解析结构吗？☐ 下游无需容错性解析吗？"
  - id: SIT-05
    title: "输出质量不稳，要提质"
    situation: "单次生成质量方差大，需要更可靠的高质量产出。"
    diagnosis: "需要引入验证/迭代——但提质有成本，且方式取决于有无客观信号。"
    relevant_laws: "LAW-01(验证易于生成) · 质量有成本"
    refs: ["ANTI-03", "ANTI-09", "LAW-01", "PAT-05", "PAT-06", "PAT-10", "Q-10"]
    recommended_patterns: "有客观信号(测试/事实)→PAT-05(Reflection) · 要把关→PAT-06(LLM-as-Judge) · 可离散比对→PAT-10(投票)"
    avoid: "ANTI-09(无目的反思——无客观锚的反思空转) · ANTI-03(为分数优化)"
    evaluation_checklist: "☐ 反思接了什么客观信号？无锚就别反思。☐ 提质的\"质量÷成本\"划算吗？☐ 裁判被校准了吗？(Q-10)"
  - id: SIT-06
    title: "我在考虑用多个 Agent"
    situation: "想把任务拆给多个 Agent 协作。"
    diagnosis: "多 Agent 应被有罪推定。正当理由只有三个：上下文隔离、真并行、权限隔离。"
    relevant_laws: "LAW-10(简单优先) · 规模不经济(协调成本超线性)"
    refs: ["ANTI-06", "ANTI-07", "LAW-10", "PAT-09", "PAT-17"]
    recommended_patterns: "确需拆→PAT-09(Planner-Executor)/PAT-17(Orchestrator-Workers)；否则PAT-16(Routing)或单 Agent"
    avoid: "ANTI-07(多 Agent 过度设计) · ANTI-06(把单体缺陷拆成多体) · 拟人化分工"
    evaluation_checklist: "☐ \"压成单 Agent 会更差吗\"我答得出吗？☐ 有单 Agent 基线对照证明净增值吗？☐ 砍掉任一 Agent 系统会变差吗？"
  - id: SIT-07
    title: "我面临不可逆或高危操作"
    situation: "下一步要发送/删除/支付/发布/修改生产数据等难以撤销的操作。"
    diagnosis: "不可逆操作。错误代价永久，且责任不可委托。这是最高优先级约束触发点。"
    relevant_laws: "LAW-09(可逆性决定审慎) · LAW-05(权限胜过自觉) · 责任不可委托 · 遍历性(避免出局)"
    refs: ["ANTI-02", "ANTI-04", "LAW-05", "LAW-09", "PAT-18"]
    recommended_patterns: "PAT-18(Human-in-the-loop——不可逆前人工审批) · 最小权限 · 幂等设计"
    avoid: "ANTI-04(过度自动化) · ANTI-02(过度信任) · 非幂等操作自动重试"
    evaluation_checklist: "☐ 这个操作有人工审批点吗？☐ 我有权限做，但该不该我做？☐ 最坏情况会导致不可恢复损失吗？→ 若会，停下。"
  - id: SIT-08
    title: "我在处理外部/不可信内容"
    situation: "要处理用户输入、检索结果、网页、工具返回值、文档等外部内容。"
    diagnosis: "一切进入上下文的文本都可能是指令。这是攻击面。"
    relevant_laws: "LAW-05(一切输入皆指令 + 权限胜过自觉) · 致命三重奏 · 数据即攻击面"
    refs: ["ANTI-10", "LAW-05"]
    recommended_patterns: "外部内容当数据非指令 · 明确标注不可信来源 · 输出侧护栏 · 最小权限兜底"
    avoid: "ANTI-10(工具/检索返回值盲信) · 集齐\"读私有数据+接触不可信+对外发送\"三要素"
    evaluation_checklist: "☐ 即使被注入，模型有权限造成实际损害吗？☐ 三要素齐了吗？砍一角。☐ 外部内容被当数据处理了吗？"
  - id: SIT-09
    title: "长任务 / 上下文在膨胀"
    situation: "任务很长、对话很多轮、上下文接近或超出窗口。"
    diagnosis: "上下文是稀缺资源。膨胀导致信噪比下降、成本上升、决策腐烂。"
    relevant_laws: "LAW-07(上下文即状态) · 信噪比 · 有效注意力有限 · LAW-06(恢复优于预防)"
    refs: ["ANTI-08", "LAW-06", "LAW-07", "PAT-11", "PAT-12"]
    recommended_patterns: "PAT-11(Context Compression——压缩为状态摘要) · PAT-12(Memory Retrieval——外置+检索) · 状态检查点(断点续跑) · 子 Agent 上下文隔离"
    avoid: "ANTI-08(记忆倾倒/上下文污染) · 无限历史 · 无检查点"
    evaluation_checklist: "☐ 上下文里每段对当前决策都相关吗？☐ 关键信息在开头/结尾而非中段吗？☐ 中断能从检查点恢复吗？"
  - id: SIT-10
    title: "我要评价一个 AI 系统好不好"
    situation: "需要判断一个 Agent/系统/版本是否优秀，或做版本对比。"
    diagnosis: "评价是判断\"在重要的事上、可靠、划算、可信地交付价值且错得起\"。防古德哈特是核心。"
    relevant_laws: "LAW-04(古德哈特) · LAW-01(验证) · LAW-03(校准) · LAW-08(信任-可靠性)"
    refs: ["ANTI-03", "ANTI-05", "LAW-01", "LAW-03", "LAW-04", "LAW-08", "PAT-06", "Q-05", "Q-09", "Q-10"]
    recommended_patterns: "PAT-06(LLM-as-Judge，须校准) · 多模式组合(benchmark+对抗+红队+持续) · 真实用户锚定"
    avoid: "ANTI-03(刷分/为分数优化) · ANTI-05(vibe check 当评价) · 只测平均/峰值 · 忽略长期价值"
    evaluation_checklist: "走 完整 10 问。最关键：☐ 我优化的是真实目标还是代理？(Q-05) ☐ 长期让用户变好吗？(Q-09) ☐ 评价者自己被校准了吗？(Q-10)"
  - id: SIT-11
    title: "我在考虑微调/定制模型"
    situation: "prompt/RAG/工具似乎不够，想微调或训练模型。"
    diagnosis: "优化阶梯的上层。微调改表现(风格/格式)不改知识(用RAG)或能力(换模型)。多数场景不该走到这。"
    relevant_laws: "优化阶梯(先穷尽上一级) · 质量>数量>算法 · LAW-04(对齐逃不过古德哈特)"
    refs: ["LAW-04", "PAT-01"]
    recommended_patterns: "先穷尽 PAT-01/03/04(prompt/RAG/工具)；确需→LoRA/DPO(先试简单的)；降本→蒸馏"
    avoid: "微调当银弹 · 微调注入知识(应用RAG) · 脏数据微调 · 无验证集(过拟合)"
    evaluation_checklist: "☐ 走完优化阶梯决策流程了吗(多数在prompt/RAG层解决)？☐ 我有高质量微调数据吗？☐ 评了它\"失去了什么\"(灾难性遗忘)吗？"
  - id: SIT-12
    title: "我怀疑数据质量有问题"
    situation: "系统表现差，怀疑根源在输入数据而非模型/架构。"
    diagnosis: "数据质量是系统上限(信息守恒)。垃圾进垃圾出，下游无法补救。"
    relevant_laws: "LAW-13(信息守恒：垃圾进垃圾出) · 质量>数量 · 抽样偏差(看不见的缺失主导盲区)"
    refs: ["LAW-13"]
    recommended_patterns: "度量六维(准确/完整/一致/时效/代表性/唯一) · 提纯优先于扩量 · 查系统性标签错误 · 防泄漏"
    avoid: "用改prompt补数据问题 · 只看平均忽略长尾/代表性 · 合成数据替代真实(分布偏差)"
    evaluation_checklist: "☐ 数据质量量化了吗(非\"感觉干净\")？☐ \"数据里缺了谁\"检查过吗？☐ 训练/评测数据隔离防泄漏了吗？"
  - id: SIT-13
    title: "任务失败/出错了，要定位和恢复"
    situation: "Agent 任务失败、报错、或产出异常，需要处理。"
    diagnosis: "需要根因定位 + 决定止损/重试/换路。警惕静默失败已污染下游。"
    relevant_laws: "LAW-06(误差累积/恢复优于预防) · 显式失败 · 幂等性"
    refs: ["ANTI-01", "LAW-06"]
    recommended_patterns: "假设驱动+5Whys定位根因 · 从检查点恢复 · 幂等重试 · 反思接客观信号后换策略"
    avoid: "ANTI-01(静默失败——编造成功结果继续) · 抓第一个原因就下结论 · 非幂等盲目重试"
    evaluation_checklist: "☐ 定位到真根因(非表面症状)了吗？☐ 修复有证据支撑吗？☐ 重试是幂等的吗？☐ 失败是显式报出的吗？"
  - id: SIT-14
    title: "我要在多个方案间做决策"
    situation: "有多个选项要选，或要做一个有不确定性的判断。"
    diagnosis: "决策问题。先分诊可逆性决定投多少审慎，再看是否有归零风险。"
    relevant_laws: "LAW-09(可逆性) · 期望值+遍历性(避免出局) · 决策与结果分离 · LAW-03(校准)"
    refs: ["LAW-03", "LAW-09"]
    recommended_patterns: "可逆快做/不可逆慎做 · 逆向思考+Pre-mortem · 二阶思维(\"各方会如何反应\") · 机会成本(含\"什么都不做\")"
    avoid: "分析瘫痪(可逆的事过度分析) · 用期望值赌上出局风险 · 用结果反推决策质量"
    evaluation_checklist: "☐ 分诊可逆性了吗？☐ 最坏情况会出局吗？☐ 我给了明确建议+诚实的置信度吗？☐ 决策记录可复盘吗？"
  - id: SIT-15
    title: "模型给了一个自信的答案，我该不该信"
    situation: "模型/子 Agent 输出了一个流畅自信的结果，要决定是否采信。"
    diagnosis: "流畅≠正确。信任应按风险分层、跟随可靠性，不被自信语气俘获。"
    relevant_laws: "LAW-02(压缩有损→幻觉) · LAW-08(信任-可靠性剪刀差) · LAW-03(校准) · 流畅非正确"
    refs: ["ANTI-02", "LAW-02", "LAW-03", "LAW-08"]
    recommended_patterns: "按风险分层验证 · 高风险独立核验/交叉验证 · 要求暴露置信度和依据 · 事实用工具核查"
    avoid: "ANTI-02(过度信任) · 被流畅度说服 · 信任推理链的形式而不验证结论"
    evaluation_checklist: "☐ 这个输出错了我多快能发现？☐ 风险多高、验证强度匹配吗？☐ 它标注不确定性了吗？"
  - id: SIT-16
    title: "我要优化/设定一个指标或 KPI"
    situation: "要给系统/团队/Agent 设一个优化目标或考核指标。"
    diagnosis: "任何指标都是真实目标的代理，优化压力会钻代理的空子。"
    relevant_laws: "LAW-04(古德哈特) · 二阶效应 · LAW-08"
    refs: ["LAW-04", "LAW-08"]
    recommended_patterns: "多个代理指标交叉 · 用真实目标而非易测代理 · 定期检验代理与真实价值相关性 · 预想\"它会怎么被钻空子\""
    avoid: "单一数字崇拜 · 优化满意度(养谄媚) · 优化处理量(牺牲质量)"
    evaluation_checklist: "☐ 这指标改善时真实目标也改善吗(而非脱钩)？☐ 它会怎么被 game？☐ 有反古德哈特的交叉指标吗？"
  - id: SIT-17
    title: "系统要上线/交付了"
    situation: "一个 AI 系统/Agent 准备部署到生产或交付给用户。"
    diagnosis: "上线前关卡。必须确认可靠性、安全、可观测、成本、失败恢复、持续监控都就位。"
    relevant_laws: "全部适用，尤其 LAW-05(安全) · LAW-09(不可逆审批) · 显式失败 · 可观测性"
    refs: ["ANTI-04", "ANTI-05", "LAW-05", "LAW-09"]
    recommended_patterns: "红队测试 · 灰度发布+可回滚 · 持续评价+漂移监控 · 成本护栏 · 全程 trace"
    avoid: "ANTI-05(无评测上线) · ANTI-04(过度自动化) · 无灰度直接全量 · 无成本核算 · 一次性评估即部署"
    evaluation_checklist: "走 完整 10 问 + ☐ 红队过了吗？☐ 能灰度+回滚吗？☐ 有持续监控和告警吗？☐ 不可逆操作有审批吗？☐ 成本可持续吗？"
  - id: SIT-18
    title: "系统太贵 / 成本失控"
    situation: "单次调用或整体运行成本超预算，或规模化后单位经济学不成立。"
    diagnosis: "成本是架构问题不是账单问题(成本结构决定架构)。先按环节归因(哪里在烧钱)再动刀；\"值不值\"按边际算，不按总量或感觉。"
    relevant_laws: "LAW-10(简单优先) · 成本结构决定架构 · 边际定律(再多一点值不值) · 质量有成本(提升÷成本必须算)"
    refs: ["ANTI-07", "LAW-10"]
    recommended_patterns: "成本按环节归因 · 模型路由(简单流量走便宜通道) · 缓存(稳定前缀/重复查询) · 上下文瘦身 · 优化阶梯(先穷尽便宜的一级)"
    avoid: "ANTI-07(多Agent过度设计——成本倍数的头号来源) · 为微小质量提升付巨大成本 · 不归因就全局降级(损害关键环节质量) · 上线后才第一次算账"
    evaluation_checklist: "☐ 成本按环节归因了吗？☐ \"质量提升÷成本倍数\"这道除法算了吗？☐ 简单流量走了便宜路径吗？☐ 规模化后的单位经济学成立吗？"
  - id: SIT-19
    title: "我在设计人与 AI 的协作制度"
    situation: "要划人机分工、设审批点、定核验强度，或已有的审批流程疑似在盖章。"
    diagnosis: "人机协作失败的共同结构是\"控制的假象\"——名义上有人把关，实际判断已让渡。审批点位置由可逆性定，审批质量由信息呈现与容量定，责任必须落到具体的人。"
    relevant_laws: "LAW-09(不可逆慢做，审批点画在可逆边界上) · LAW-12(判断力稀缺，责任不可委托) · LAW-08(信任随可靠性而非能力)"
    refs: ["LAW-08", "LAW-09", "LAW-12"]
    recommended_patterns: "按可验证性/可逆性/比较优势分工 · 核验强度按风险分层 · 注入质检测真实错误捕获率 · 批准/拒绝成本对称(防盖章)"
    avoid: "盖章者陷阱(100%通过率且说不出拦过什么的审批点) · 按拟人职位分工 · 用感知能力定信任 · 责任真空(\"是 AI 做的\")"
    evaluation_checklist: "☐ 每个审批点拦截过什么，说得出吗？☐ 核验强度与风险分层挂钩了吗？☐ 错误捕获率被注入质检测过吗？☐ 每个 AI 行动\"错了谁负责\"有具体的人吗？"
  - id: SIT-20
    title: "系统在悄悄变差（静默退化/漂移）"
    situation: "无明确故障但质量在缓慢下滑，或怀疑分布漂移、数据腐烂、评测过时——一切都返回 200 OK。"
    diagnosis: "静默退化比崩溃危险：不触发任何警报，被发现时已积重难返。唯一手段是持续评测基线 + 输入分布监控——LLM 系统会在\"成功响应\"里静默地错。"
    relevant_laws: "LAW-03(分布内才可靠——漂移即离开分布) · 静默降级危险 · 古德哈特(仪表盘还绿着不等于没退化，指标可能测错东西)"
    refs: ["ANTI-01", "LAW-03"]
    recommended_patterns: "持续评测基线(能用数字回答\"这周变好还是变坏\") · 输入分布与上线基线对比 · 金丝雀样本定期重跑 · 评测集随真实分布更新"
    avoid: "ANTI-01(静默失败) · 上线即停止监控 · 把退化归因给模型而不查数据/分布 · 用过时的评测集宣布健康"
    evaluation_checklist: "☐ 有持续运行的评测基线吗？☐ 当前输入分布与上线时对比过吗？☐ \"这周变好还是变坏\"能用数字回答吗？☐ 评测集反映的还是当前的真实分布吗？"
  - id: SIT-21
    title: "我在做多模态输入 / 截图 / 语音 / 视频驱动的 Agent"
    situation: "系统要读取截图、图像、音频、视频、屏幕或传感器输入，并据此回答、操作工具或驱动 Agent 行动。"
    diagnosis: "这不是“模型多会一项技能”，而是系统多了一条不可靠输入通道。先分清感知错误、表征损失、推理错误和行动错误，再决定是否能自动化。"
    relevant_laws: "LAW-13(信息守恒：没采到/没看清的信息不能靠推理补成事实) · LAW-05(像素/声波里的内容也可能是指令，权限兜底) · LAW-03(分布边界与校准) · LAW-07(跨模态上下文要显式合成状态) · LAW-08(不要因视觉流畅感过度信任)"
    refs: ["ANTI-02", "ANTI-04", "ANTI-05", "ANTI-10", "LAW-03", "LAW-05", "LAW-07", "LAW-08", "LAW-13", "PAT-08", "PAT-15", "PAT-16", "PAT-18", "PAT-19", "Q-03", "Q-06", "Q-07", "Q-08", "Q-10"]
